<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540">
<title>Codex with ChatGPT 安装配对流程</title><desc>从安装 Skill 到连接 ChatGPT 的使用流程图</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e46b45"/></marker></defs>
<rect width="1280" height="540" fill="#f7f3ea"/><text x="58" y="68" fill="#183d4a" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="40px" font-weight="700" text-anchor="start">安装、连接、配对、开始使用</text><text x="60" y="106" fill="#496771" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="20px" font-weight="400" text-anchor="start">第一次配置完成后，默认用 DeepSeek，后面直接正常说话即可。</text><rect x="58" y="160" width="250" height="244" rx="22" fill="#ffffff" stroke="#d7e1df" stroke-width="2"/><rect x="83" y="184" width="56" height="32" rx="16" fill="#e46b45" stroke="#e46b45" stroke-width="2"/><text x="111" y="207" fill="#ffffff" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="14px" font-weight="700" text-anchor="middle">01</text><g transform="translate(160 234)"><path d="M32 7v37M17 32l15 15 15-15M10 57h44" fill="none" stroke="#e46b45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="330" fill="#183d4a" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="22px" font-weight="700" text-anchor="start">安装 Skill</text><text x="83" y="368" fill="#496771" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="15px" font-weight="400" text-anchor="start">运行 install.ps1 / install.sh</text><rect x="350" y="160" width="250" height="244" rx="22" fill="#ffffff" stroke="#d7e1df" stroke-width="2"/><rect x="375" y="184" width="56" height="32" rx="16" fill="#3f7d78" stroke="#3f7d78" stroke-width="2"/><text x="403" y="207" fill="#ffffff" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="14px" font-weight="700" text-anchor="middle">02</text><g transform="translate(452 234)"><path d="M22 8v20M42 8v20M15 27h34v5a17 17 0 0 1-34 0zM32 49v13" fill="none" stroke="#3f7d78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="375" y="330" fill="#183d4a" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="22px" font-weight="700" text-anchor="start">填写连接器</text><text x="375" y="368" fill="#496771" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="15px" font-weight="400" text-anchor="start">每个项目使用独立连接名称</text><rect x="642" y="160" width="250" height="244" rx="22" fill="#ffffff" stroke="#d7e1df" stroke-width="2"/><rect x="667" y="184" width="56" height="32" rx="16" fill="#3975a7" stroke="#3975a7" stroke-width="2"/><text x="695" y="207" fill="#ffffff" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="14px" font-weight="700" text-anchor="middle">03</text><g transform="translate(744 234)"><circle cx="22" cy="27" r="13" fill="none" stroke="#3975a7" stroke-width="5"/><path d="m33 36 27 21M48 48l8-8M41 42l8-8" fill="none" stroke="#3975a7" stroke-width="5" stroke-linecap="round"/></g><text x="667" y="330" fill="#183d4a" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="22px" font-weight="700" text-anchor="start">输入配对码</text><text x="667" y="368" fill="#496771" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="15px" font-weight="400" text-anchor="start">把 Codex 显示的一次性代码填入评审网页</text><rect x="934" y="160" width="250" height="244" rx="22" fill="#ffffff" stroke="#d7e1df" stroke-width="2"/><rect x="959" y="184" width="56" height="32" rx="16" fill="#d36c45" stroke="#d36c45" stroke-width="2"/><text x="987" y="207" fill="#ffffff" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="14px" font-weight="700" text-anchor="middle">04</text><g transform="translate(1036 234)"><circle cx="32" cy="32" r="26" fill="none" stroke="#d36c45" stroke-width="5"/><path d="m18 32 9 9 19-20" fill="none" stroke="#d36c45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="959" y="330" fill="#183d4a" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="22px" font-weight="700" text-anchor="start">选择渠道并使用</text><text x="959" y="368" fill="#496771" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="15px" font-weight="400" text-anchor="start">默认 DeepSeek，说 GPT 可切换</text><path d="M308 282 L343 282" stroke="#e46b45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M600 282 L635 282" stroke="#e46b45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M892 282 L927 282" stroke="#e46b45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="58" y="450" width="1164" height="60" rx="18" fill="#183d4a" stroke="#183d4a" stroke-width="2"/><text x="88" y="488" fill="#ffffff" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="18px" font-weight="600" text-anchor="start">以后只需在 Codex 里说：使用 Codex with ChatGPT 帮我分析、修改并测试。</text></svg>