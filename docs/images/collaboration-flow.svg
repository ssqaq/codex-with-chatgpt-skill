<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540">
<title>ChatGPT 和 Codex 协作流程</title><desc>ChatGPT 和 Codex 从需求到复核的流程图</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e46b45"/></marker></defs>
<rect width="1280" height="540" fill="#f7f3ea"/><text x="58" y="68" fill="#183d4a" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="40px" font-weight="700" text-anchor="start">评审渠道和 Codex 怎么配合</text><text x="60" y="106" fill="#496771" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="20px" font-weight="400" text-anchor="start">先选择渠道，再评审；达成共识后才动手。</text><rect x="58" y="160" width="250" height="240" rx="22" fill="#ffffff" stroke="#d7e1df" stroke-width="2"/><rect x="84" y="184" width="52" height="52" rx="14" fill="#3f7d78" stroke="#3f7d78" stroke-width="2"/><text x="110" y="219" fill="#ffffff" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="22px" font-weight="700" text-anchor="middle">1</text><g transform="translate(158 180)"><path d="M8 8h48v32H28L14 54V40H8z" fill="none" stroke="#3f7d78" stroke-width="4" stroke-linejoin="round"/><path d="M18 20h28M18 29h20" stroke="#3f7d78" stroke-width="4" stroke-linecap="round"/></g><text x="84" y="294" fill="#183d4a" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23px" font-weight="700" text-anchor="start">选择评审渠道</text><text x="84" y="333" fill="#496771" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="16px" font-weight="400" text-anchor="start">默认 DeepSeek，可说 GPT 切换</text><rect x="350" y="160" width="250" height="240" rx="22" fill="#ffffff" stroke="#d7e1df" stroke-width="2"/><rect x="376" y="184" width="52" height="52" rx="14" fill="#6b5aa6" stroke="#6b5aa6" stroke-width="2"/><text x="402" y="219" fill="#ffffff" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="22px" font-weight="700" text-anchor="middle">2</text><g transform="translate(450 180)"><path d="M8 8h48v32H28L14 54V40H8z" fill="none" stroke="#6b5aa6" stroke-width="4" stroke-linejoin="round"/><path d="M18 20h28M18 29h20" stroke="#6b5aa6" stroke-width="4" stroke-linecap="round"/></g><text x="376" y="294" fill="#183d4a" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23px" font-weight="700" text-anchor="start">单次或多轮评审</text><text x="376" y="333" fill="#496771" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="16px" font-weight="400" text-anchor="start">回显轮次、同意点、分歧点</text><rect x="642" y="160" width="250" height="240" rx="22" fill="#ffffff" stroke="#d7e1df" stroke-width="2"/><rect x="668" y="184" width="52" height="52" rx="14" fill="#3975a7" stroke="#3975a7" stroke-width="2"/><text x="694" y="219" fill="#ffffff" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="22px" font-weight="700" text-anchor="middle">3</text><g transform="translate(742 180)"><circle cx="32" cy="32" r="26" fill="none" stroke="#3975a7" stroke-width="5"/><path d="m18 32 9 9 19-20" fill="none" stroke="#3975a7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="668" y="294" fill="#183d4a" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23px" font-weight="700" text-anchor="start">达成共识</text><text x="668" y="333" fill="#496771" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="16px" font-weight="400" text-anchor="start">共识前不修改文件</text><rect x="934" y="160" width="250" height="240" rx="22" fill="#ffffff" stroke="#d7e1df" stroke-width="2"/><rect x="960" y="184" width="52" height="52" rx="14" fill="#d36c45" stroke="#d36c45" stroke-width="2"/><text x="986" y="219" fill="#ffffff" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="22px" font-weight="700" text-anchor="middle">4</text><g transform="translate(1034 180)"><path d="m26 10-18 18 18 18M46 10l18 18-18 18M39 4 31 52" fill="none" stroke="#d36c45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="960" y="294" fill="#183d4a" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="23px" font-weight="700" text-anchor="start">修改测试复核</text><text x="960" y="333" fill="#496771" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="16px" font-weight="400" text-anchor="start">Codex 执行并返回结果</text><path d="M308 280 L343 280" stroke="#e46b45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M600 280 L635 280" stroke="#e46b45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M892 280 L927 280" stroke="#e46b45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="58" y="450" width="1164" height="60" rx="18" fill="#183d4a" stroke="#183d4a" stroke-width="2"/><text x="88" y="488" fill="#ffffff" font-family="SimHei, Microsoft YaHei, sans-serif" font-size="18px" font-weight="600" text-anchor="start">每个 Codex 线程复用专用评审会话；失败快速暂停，不重复发送。</text></svg>